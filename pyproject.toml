[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaproject"
version = "0.9.1"
description = "A CLI tool for scaffolding and managing agentic projects and templates"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "John Fricker" }
]
# Core: what a fresh container needs for `--version`, `backfill`, `adopt` and
# `review --no-tui`. Everything interactive or catalog-backed is in the `tui` extra.
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
]

[project.scripts]
metaproject = "metaproject.cli:app"

[project.optional-dependencies]
# The interactive TUIs and prompts (`textual`, `questionary`) and the SQLite catalog
# behind `universe`, `learn` and `doctor` (`sqlite-utils`).
tui = [
    "textual==8.2.8",
    "questionary>=2.0.0",
    "sqlite-utils>=3.36",
]
dev = [
    "metaproject[tui]",
    # Release tooling (`make testpypi` / `make pypi`), not a runtime dependency.
    "twine>=7.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    # `make build` runs `uv build --no-build-isolation`, so the backend named in
    # [build-system].requires must already be present in the environment.
    "hatchling>=1.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metaproject"]

[tool.hatch.build.targets.wheel.package-data]
"metaproject" = ["templates/**", "skill/**", "sdlc_skills/**", "hook_scripts/**", "skill_history.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
